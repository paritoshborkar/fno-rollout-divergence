# @package _global_
# Usage: uv run python -m fnorollout.scripts.train_fno2d +training_experiments=experiment_2.4

# Train with two snapshots as input

id: "2.4"

defaults:
  - /data_sources@data.sources.qg_beta_forced: qg_beta_forced
  - override /data_sources@data.sources.torus2d_example: null # Remove default data source

data:
  trajectory: 
    n_input_snapshots: 2

model:
  in_channels: 2


hydra:
  run:
    dir: outputs/training_experiment_${id}
  job:
    chdir: true

wandb:
  name: training_experiment_${id}
  tags: ["multi_trajectory", "single_beta", "forced_beta_turbulence", "no_viscosity", "seed_change_only", "multi_snapshot"]
