# @package _global_
# Usage: uv run python -m fnorollout.scripts.train_fno2d +training_experiments=experiment_2.14
id: "2.14"

defaults:
  - /data_sources@data.sources.qg_beta_forced: qg_beta_forced
  - override /loss@loss.training_loss: wasserstein_w2
  - override /data_sources@data.sources.torus2d_example: null # Remove default data source

model:
  n_modes: [64, 64]

hydra:
  run:
    dir: outputs/training_experiment_${id}
  job:
    chdir: true

wandb:
  name: training_experiment_${id}
  tags: ["multi_trajectory", "single_beta", "forced_beta_turbulence", "no_viscosity", "seed_change_only", "wasserstein"]
