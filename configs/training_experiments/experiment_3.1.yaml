# @package _global_
# Usage: uv run python -m fnorollout.scripts.train_fno2d +training_experiments=experiment_3.1
id: 3.1

defaults:
  - /data_sources@data.sources.qg_beta_sweep_small: qg_beta_sweep_small
  - override /data_sources@data.sources.torus2d_example: null # Remove default data source

data:
  split:
    train: 1.0
    val: 0.0

hydra:
  run:
    dir: outputs/training_experiment_${id}
  job:
    chdir: true

wandb:
  name: training_experiment_${id}
  tags: ["multi_trajectory", "multi_beta", "forced_beta_turbulence", "no_viscosity"]
